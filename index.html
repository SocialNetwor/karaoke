<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>유튜브 노래방</title>
<style>
:root{
  --ink:#0B0714;--room:#150E26;--panel:#1E1538;--panel2:#281C48;--line:#3A2C60;
  --text:#EFE8FF;--dim:#9A8CBC;--dim2:#6E6091;
  --hot:#FF3D7F;--mint:#35E6D0;--gold:#FFC53D;--bad:#FF6B6B;
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(900px 560px at 8% -10%,#2A1A4E 0%,transparent 60%),
             radial-gradient(700px 500px at 100% 0%,#3A1030 0%,transparent 55%),var(--ink);
  color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select{font-family:inherit;color:inherit;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3A2C60;border-radius:8px}
.hidden{display:none!important}

/* 경고 배너 */
.warnbar{background:linear-gradient(135deg,#7A1030,#4A0A1E);padding:12px 16px;font-size:12.5px;line-height:1.6;border-bottom:1px solid #9A2048}
.warnbar b{color:var(--gold)}

/* 상단 */
.top{position:sticky;top:0;z-index:30;background:rgba(11,7,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:12px 14px}
.lamp{width:11px;height:11px;border-radius:50%;background:var(--hot);box-shadow:0 0 12px var(--hot);flex:none;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top h1{margin:0;font-size:15px;font-weight:900;letter-spacing:-.02em;flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}

.searchrow{display:flex;gap:8px;padding:0 14px 12px}
.searchrow input{flex:1;min-width:0;background:#120C22;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.searchrow input:focus{border-color:var(--hot)}
.sbtn{padding:0 16px;border-radius:12px;background:linear-gradient(135deg,var(--hot),#B32A8E);font-weight:800;font-size:14px;flex:none}
.qbtn{padding:0 14px;border-radius:12px;background:linear-gradient(135deg,var(--mint),#12A594);color:#04231F;font-weight:800;font-size:13px;flex:none}

.chiprow{display:flex;gap:7px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--gold),#E09A00);color:#241700;border-color:transparent}
.linkrow{display:flex;gap:7px;padding:0 14px 12px}
.linkrow button{flex:1;padding:10px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim)}
.linkrow button:active{color:var(--text);border-color:var(--mint)}
.bookrow{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--panel);border-radius:12px;margin-bottom:7px}
.bookrow .t{flex:1;min-width:0}
.bookrow .t b{display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookrow .t small{font-size:11px;color:var(--dim)}
.bookrow button{padding:7px 10px;border-radius:9px;background:var(--panel2);font-size:11.5px;font-weight:800;flex:none}
.bookrow .go{background:linear-gradient(135deg,var(--hot),#B32A8E)}

/* 결과 */
.body{padding:14px 14px calc(96px + var(--safe-b))}
.res{display:flex;gap:11px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;align-items:center}
.res .th{width:104px;aspect-ratio:16/9;border-radius:9px;object-fit:cover;background:#0D0818;flex:none}
.res .rk{position:absolute;margin:-4px 0 0 -6px;font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--gold)}
.res .info{flex:1;min-width:0}
.res .info b{display:block;font-size:13.5px;font-weight:700;line-height:1.42;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .info small{color:var(--dim);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.res .acts button{padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.res .acts .go{background:linear-gradient(135deg,var(--hot),#B32A8E);border-color:transparent}
.note{font-size:12.5px;color:var(--dim);text-align:center;padding:34px 20px;line-height:1.8}
.note b{color:var(--text)}
.errbox{text-align:left;background:rgba(255,61,127,.09);border:1px solid rgba(255,61,127,.4);border-radius:12px;padding:14px;margin-bottom:16px}
.errbox b{display:block;color:var(--gold);font-size:14px;margin-bottom:6px}
.errbox p{margin:0 0 10px;font-size:12.5px;line-height:1.75;color:var(--text)}
.errbox code{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);background:#0D0818;border-radius:8px;padding:9px;
  word-break:break-all;line-height:1.6}
.tiny{font-size:11.5px;color:var(--mint)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--hot);border-radius:50%;margin:34px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 하단 예약바 */
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px 14px calc(10px + var(--safe-b));
  background:rgba(20,13,38,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
.qbar .qinfo{flex:1;min-width:0}
.qbar .qinfo b{display:block;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar .qinfo small{font-size:11.5px;color:var(--dim)}
.qbar .play{padding:13px 20px;border-radius:12px;background:linear-gradient(135deg,var(--mint),#12A594);color:#04231F;font-weight:900;font-size:14px;flex:none}
.qbar .list{width:46px;height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:16px;flex:none;position:relative}
.qbar .list em{position:absolute;top:-5px;right:-5px;background:var(--hot);color:#fff;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 5px;border-radius:99px}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(4,2,10,.72);display:flex;align-items:flex-end}
.sheet-in{width:100%;max-height:82vh;background:var(--room);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:16px 14px calc(20px + var(--safe-b));overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:16px;font-weight:900}
.sheet .sd{font-size:12.5px;color:var(--dim);margin:0 0 14px;line-height:1.65}
.qrow{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border-radius:12px;margin-bottom:8px;border:1px solid transparent}
.qrow.now{border-color:var(--hot);background:rgba(255,61,127,.1)}
.qrow .n{font-family:var(--mono);font-size:11px;color:var(--gold);width:18px;flex:none;text-align:center}
.qrow .t{flex:1;min-width:0}
.qrow .t b{display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .t small{font-size:11px;color:var(--dim)}
.qrow button{width:32px;height:32px;border-radius:9px;background:var(--panel2);font-size:14px;flex:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:#120C22;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;outline:none}
.field small{display:block;font-size:11.5px;color:var(--dim2);margin-top:6px;line-height:1.6}
.field a{color:var(--mint)}
.devbox{font-size:12.5px;line-height:1.7;border-radius:11px;padding:11px 13px;margin-bottom:14px}
.devbox.ok{background:rgba(53,230,208,.1);border:1px solid rgba(53,230,208,.35);color:var(--mint)}
.devbox.no{background:rgba(255,197,61,.1);border:1px solid rgba(255,197,61,.4);color:var(--text)}
.devbox b{color:var(--gold)}
.btn{padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--hot),#B32A8E);border-color:transparent}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#120C22;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.toggle b{font-size:13.5px}.toggle small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.sw{width:46px;height:26px;border-radius:99px;background:#2C2050;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--mint)}.sw.on::after{left:23px;background:#04231F}
.slider{width:100%;accent-color:var(--hot)}

/* 무대 */
.stage{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.ytwrap{position:absolute;inset:0}
#ytPlayer{width:100%;height:100%}
.tapcatch{position:absolute;inset:0;z-index:2}
.st-top{position:relative;z-index:4;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:opacity .35s}
.st-top .tt{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.4;text-shadow:0 2px 10px #000;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-top .ts{font-size:12px;color:#C3B5E6;margin-top:3px}
.st-spacer{flex:1}
.st-bot{position:relative;z-index:4;padding:12px 14px calc(14px + var(--safe-b));background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);transition:opacity .35s}
.st-top.away,.st-bot.away{opacity:0;pointer-events:none}
.prog{height:20px;display:flex;align-items:center;cursor:pointer;margin-bottom:6px}
.prog .bar{height:5px;width:100%;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));border-radius:99px}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#C3B5E6;margin-bottom:10px}

/* 후보 다이얼 */
.dial{display:flex;align-items:center;gap:7px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dial::-webkit-scrollbar{display:none}
.dial .dl{font-family:var(--mono);font-size:10px;color:#9A8CBC;letter-spacing:.1em;flex:none;padding-right:2px}
.dial .d{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  font-family:var(--mono);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dial .d.on{background:linear-gradient(135deg,var(--gold),#E09A00);color:#241700;border-color:transparent}
.dial .d.dead{opacity:.32;text-decoration:line-through}

.ctrls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cb{height:46px;min-width:46px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.cb.play{background:linear-gradient(135deg,var(--hot),#B32A8E);border-color:transparent;font-size:17px;min-width:58px}
.cb.on{background:linear-gradient(135deg,var(--mint),#12A594);color:#04231F;border-color:transparent}
.cb.exit{background:rgba(255,60,60,.2);border-color:rgba(255,90,90,.4)}
.grp{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:4px;height:46px}
.grp .gl{font-family:var(--mono);font-size:10px;color:#B9A9DC;padding:0 4px}
.grp button{width:32px;height:36px;border-radius:8px;background:rgba(255,255,255,.1);font-size:16px;font-weight:700}
.grp .gv{font-family:var(--mono);font-size:13px;font-weight:700;min-width:40px;text-align:center;color:var(--gold)}
.vchips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
.vchips::-webkit-scrollbar{display:none}
.vchips .vc{flex:none;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700;white-space:nowrap}
.vchips .vc.on{background:linear-gradient(135deg,var(--mint),#12A594);color:#04231F;border-color:transparent}

.upnext{position:absolute;right:14px;bottom:calc(100% + 8px);z-index:4;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:7px 11px;font-size:11.5px;max-width:64vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext em{font-style:normal;color:var(--gold);font-weight:700;margin-right:5px}
.stmsg{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:34px;text-align:center;
  font-size:14px;line-height:1.8;color:#C3B5E6;background:rgba(4,2,10,.86)}
.stmsg b{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(12px);z-index:200;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;
  opacity:0;transition:.26s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(min-width:760px){.body,.top-in,.searchrow,.chiprow{max-width:820px;margin-left:auto;margin-right:auto}
  .qbar{justify-content:center}.qbar .qinfo{max-width:460px}}
</style>
</head>
<body>

<div class="warnbar hidden" id="warnBar"></div>

<header class="top">
  <div class="top-in">
    <div class="lamp"></div>
    <h1>유튜브 노래방</h1>
    <button class="iconbtn" id="btnBook" title="내 노래책">📖</button>
    <button class="iconbtn" id="btnMic" title="마이크">🎤</button>
    <button class="iconbtn" id="btnSet" title="설정">⚙</button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="곡명, 가수, 또는 유튜브 링크" autocomplete="off" enterkeyhint="search">
    <button class="sbtn" id="btnSearch">검색</button>
    <button class="qbtn" id="btnQuick">바로예약</button>
  </div>
  <div class="chiprow" id="chips"></div>
  <div class="linkrow">
    <button id="btnYT">유튜브에서 찾기</button>
    <button id="btnPaste">복사한 링크 붙여넣기</button>
  </div>
</header>

<main class="body" id="results">
  <div class="note">
    <b>구글 계정 없이도 쓸 수 있습니다.</b><br><br>
    ① <b>유튜브에서 찾기</b>로 원하는 노래방 영상을 고르고<br>
    ② 유튜브에서 링크를 복사한 뒤<br>
    ③ <b>복사한 링크 붙여넣기</b>를 누르면 예약됩니다.<br><br>
    한 번 넣은 곡은 <b>📖 내 노래책</b>에 저장되니<br>다음부터는 탭 한 번으로 끝납니다.
  </div>
</main>

<div class="qbar">
  <button class="list" id="btnQueue">☰<em id="qCount">0</em></button>
  <div class="qinfo"><b id="qNow">예약된 곡이 없습니다</b><small id="qSub">곡을 검색해 예약하세요</small></div>
  <button class="play" id="btnStart">시작</button>
</div>

<!-- 무대 -->
<div class="stage hidden" id="stage">
  <div class="ytwrap"><div id="ytPlayer"></div><div class="tapcatch" id="tapCatch"></div></div>
  <div class="st-top" id="stTop">
    <div class="tt" id="stTitle">—</div>
    <div class="ts" id="stSub"></div>
  </div>
  <div class="st-spacer"></div>
  <div class="stmsg hidden" id="stMsg"></div>
  <div class="st-bot" id="stBot">
    <div class="upnext hidden" id="upNext"></div>
    <div class="prog" id="prog"><div class="bar"><i id="progFill"></i></div></div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="dial" id="dial"></div>
    <div class="ctrls">
      <button class="cb play" id="cPlay">▶</button>
      <button class="cb" id="cBack">-10초</button>
      <button class="cb" id="cFwd">+10초</button>
      <div class="grp">
        <span class="gl">속도</span>
        <button data-rate="-1">−</button><span class="gv" id="cRate">1.00</span><button data-rate="1">+</button>
      </div>
      <button class="cb" id="cNext">다음곡</button>
      <button class="cb" id="cFull">⛶</button>
      <button class="cb exit" id="cExit">✕</button>
    </div>
    <div class="vchips" id="vchips"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let tT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2600)}

/* ── 저장소 ─────────────────────────────── */
const LS={
  get(k,d){try{const v=localStorage.getItem('yk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('yk_'+k,JSON.stringify(v))}catch(e){}}
};

/* ── 버전(검색어 변형) ──────────────────── */
const VERSIONS=[
  {id:'basic', label:'노래방',   suffix:'노래방'},
  {id:'tj',    label:'TJ',       suffix:'TJ노래방'},
  {id:'ky',    label:'금영',     suffix:'금영노래방'},
  {id:'up2',   label:'키 +2',    suffix:'노래방 2키 올림'},
  {id:'up4',   label:'키 +4',    suffix:'노래방 4키 올림'},
  {id:'dn2',   label:'키 −2',    suffix:'노래방 2키 내림'},
  {id:'dn4',   label:'키 −4',    suffix:'노래방 4키 내림'},
  {id:'male',  label:'남자키',   suffix:'노래방 남자키'},
  {id:'female',label:'여자키',   suffix:'노래방 여자키'},

/* ── 링크 직접 넣기 (API 키 없이도 동작) ── */
function parseYTIds(str){
  const out=[];
  const re=/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/g;
  let m;while((m=re.exec(str||''))) if(!out.includes(m[1])) out.push(m[1]);
  const t=(str||'').trim();
  if(!out.length&&/^[A-Za-z0-9_-]{11}$/.test(t))out.push(t);
  return out;
}
const parseYTId=x=>parseYTIds(x)[0]||null;

async function ytMeta(id){
  let title='유튜브 영상', ch='';
  try{
    const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    if(r.ok){const j=await r.json();title=j.title||title;ch=j.author_name||''}
  }catch(e){}
  return {id,title,ch,dur:0,th:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'};
}
async function addByUrl(str,playNow){
  const ids=parseYTIds(str);
  if(!ids.length)return 0;
  let n=0;
  for(const id of ids){
    const meta=await ytMeta(id);
    enqueue([meta],0,meta.title,S.ver,playNow&&n===0);
    n++;
  }
  $('#q').value='';$('#q').blur();
  if(playNow){openStage();playIdx(0)}
  return n;
}

  if(!m||!m.id)return;
  S.book=S.book.filter(x=>x.id!==m.id);
  S.book.unshift({id:m.id,title:m.title,ch:m.ch||''});
  if(S.book.length>400)S.book.length=400;
  LS.set('book',S.book);
}

/* ── 검색 ───────────────────────────────── */
const cacheKey=q=>'c_'+q;
function cacheGet(q){const c=LS.get(cacheKey(q),null);if(!c)return null;if(Date.now()-c.t>7*864e5)return null;return c.r}
function cacheSet(q,r){
  try{localStorage.setItem('yk_'+cacheKey(q),JSON.stringify({t:Date.now(),r}))}
  catch(e){
    try{Object.keys(localStorage).filter(k=>k.startsWith('yk_c_')).forEach(k=>localStorage.removeItem(k));
        localStorage.setItem('yk_'+cacheKey(q),JSON.stringify({t:Date.now(),r}))}catch(e2){}
  }
}

function buildQuery(term,verId){
  const v=verById(verId);
  return (term.trim()+' '+v.suffix).replace(/\s+/g,' ').trim();
}
function isoDur(s){
  const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||'');
  if(!m)return 0;
  return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
}
async function searchYT(query){
  const hit=cacheGet(query);
  if(hit)return hit;
  let rows=null;
  if(S.key){
    try{
      const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true'
        +'&maxResults=12&regionCode=KR&relevanceLanguage=ko&q='+encodeURIComponent(query)+'&key='+encodeURIComponent(S.key);
      const r=await fetch(u);
      const j=await r.json();
      if(j.error) throw new Error(j.error.message||'API 오류');
      S.lastErr='';
      rows=(j.items||[]).map(it=>({
        id:it.id.videoId, title:it.snippet.title, ch:it.snippet.channelTitle,
        th:(it.snippet.thumbnails.medium||it.snippet.thumbnails.default).url, dur:0
      }));
      // 길이 채우기 (1유닛)
      try{
        const ids=rows.map(r=>r.id).join(',');
        const r2=await fetch('https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id='+ids+'&key='+encodeURIComponent(S.key));
        const j2=await r2.json();
        const map={};(j2.items||[]).forEach(v=>map[v.id]=isoDur(v.contentDetails.duration));
        rows.forEach(r=>r.dur=map[r.id]||0);
      }catch(e){}
    }catch(e){ S.lastErr=e.message||String(e); rows=null; }
  }
  if(!rows){
    for(const base of S.invs){
      try{
        const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),6500);
        const r=await fetch(base.replace(/\/$/,'')+(base.includes('piped')?'/search?filter=videos&q=':'/api/v1/search?type=video&region=KR&q=')+encodeURIComponent(query),{signal:ctl.signal});
        clearTimeout(to);
        if(!r.ok)continue;
        let j=await r.json();
        if(j&&!Array.isArray(j)&&Array.isArray(j.items)){
          j=j.items.filter(v=>v.url).map(v=>({
            videoId:(v.url.match(/v=([A-Za-z0-9_-]{11})/)||[])[1],
            title:v.title, author:v.uploaderName||'', lengthSeconds:v.duration||0,
            videoThumbnails:[{quality:'medium',url:v.thumbnail||''}]
          }));
        }
        if(!Array.isArray(j)||!j.length)continue;
        rows=j.filter(v=>v.videoId).slice(0,12).map(v=>({
          id:v.videoId, title:v.title, ch:v.author, dur:v.lengthSeconds||0,
          th:(v.videoThumbnails&&(v.videoThumbnails.find(t=>t.quality==='medium')||v.videoThumbnails[0])||{}).url||''
        }));
        break;
      }catch(e){}
    }
  }
  if(!rows||!rows.length)return null;
  cacheSet(query,rows);
  return rows;
}

async function doSearch(term,opts){
  opts=opts||{};
  term=(term||'').trim();
  if(!term){toast('곡명을 입력하세요');return null}
  if(parseYTId(term)){ const n=await addByUrl(term); toast(n+'곡을 예약했습니다'); return null; }
  const query=buildQuery(term,S.ver);
  S.lastQuery=term;
  if(!opts.silent){
    $('#results').innerHTML='<div class="spin"></div>';
  }
  const rows=await searchYT(query);
  if(!rows){
    if(!opts.silent) renderFail(term);
    else toast('검색에 실패했습니다 — 설정에서 API 키를 넣어주세요');
    return null;
  }
  S.results=rows;
  if(!opts.silent)renderResults(rows,query);
  return rows;
}
function explainErr(msg){
  const m=(msg||'').toLowerCase();
  if(!msg)return null;
  if(m.includes('has not been used')||m.includes('disabled')||m.includes('is not enabled'))
    return {t:'YouTube Data API v3가 아직 켜져 있지 않습니다',
            d:'구글 클라우드 → API 라이브러리에서 YouTube Data API v3를 찾아 파란 <b>사용</b> 버튼을 누르세요. 누른 뒤 2분쯤 기다렸다가 다시 검색해 보세요.'};
  if(m.includes('service_blocked')||m.includes('requests to this api')||m.includes('api_key_service_blocked'))
    return {t:'이 키가 유튜브를 쓰도록 허용돼 있지 않습니다',
            d:'구글 클라우드 → 사용자 인증 정보 → 이 키를 열고, <b>API 제한사항 선택</b> 칸에서 '
             +'<b>YouTube Data API v3</b>에 체크하세요. 다른 API만 체크돼 있으면 유튜브 요청이 막힙니다. '
             +'목록에 안 보이면 API 라이브러리에서 먼저 <b>사용</b>을 누르세요. 저장 후 최대 5분 걸립니다.'};
  if(m.includes('referer')||m.includes('referrer')||m.includes('blocked'))
    return {t:'키에 걸어둔 주소 제한에 막혔습니다',
            d:'사용자 인증 정보에서 이 키를 열고, HTTP 리퍼러 목록에 <b>'+location.origin+'/*</b> 를 넣으세요. 제한을 잠시 <b>없음</b>으로 바꿔 시험해 봐도 됩니다.'};
  if(m.includes('not valid')||m.includes('invalid'))
    return {t:'키가 올바르지 않습니다',
            d:'앞뒤에 빈칸이나 따옴표가 섞이지 않았는지 확인하고, AIza로 시작하는 전체를 다시 복사해 붙여넣으세요.'};
  if(m.includes('quota')||m.includes('exceeded'))
    return {t:'오늘 검색 횟수를 다 썼습니다',
            d:'하루 100번쯤이 한도이고 한국 시간 오후 4~5시경에 초기화됩니다. 그때까지는 유튜브 링크를 붙여넣어 쓰세요.'};
  if(m.includes('failed to fetch')||m.includes('networkerror'))
    return {t:'구글에 연결하지 못했습니다',
            d:'광고 차단 확장프로그램이나 회사 방화벽이 막는 경우가 많습니다. 시크릿 창이나 휴대폰 데이터로 다시 시도해 보세요.'};
  return {t:'구글이 요청을 거절했습니다',d:'아래 원문을 확인하세요.'};
}

function enqueue(rows,idx,term,verId,front){
  const item={
    term, ver:verId,
    cand:rows.map(r=>({id:r.id,title:r.title,ch:r.ch,dur:r.dur})),
    ci:idx, dead:[]
  };
  bookAdd(rows[idx]);
  if(front)S.queue.unshift(item); else S.queue.push(item);
  saveQueue();
  toast('예약: '+rows[idx].title.slice(0,24)+(front?'':' ('+S.queue.length+'번째)'));
}
async function quickReserve(){

  +'<textarea id="sInv" rows="4">'+esc(S.invs.join('\n'))+'</textarea>'
  +'<small>공개 서버라 자주 멈춥니다. 되도록 API 키를 쓰세요.</small></div>'
  +'<div class="toggle"><div><b>곡이 끝나면 다음곡 자동재생</b><small>예약 목록을 순서대로 넘깁니다</small></div><div class="sw'+(S.autoNext?' on':'')+'" id="sAuto"></div></div>'
  +'<div class="btnrow"><button class="btn pri" id="sSave">저장</button>'

  +'남에게는 보내지 마세요 — 내 검색 횟수를 대신 쓰게 됩니다.</small></div>'
  +'<button class="btn" id="sCopy">주소 복사</button></div>'
  ,w=>{
    $('#sAuto',w).onclick=e=>{S.autoNext=!S.autoNext;e.currentTarget.classList.toggle('on',S.autoNext);LS.set('autoNext',S.autoNext)};
    $('#sSave',w).onclick=()=>{
      S.key=$('#sKey',w).value.trim();LS.set('apikey',S.key);
      S.invs=$('#sInv',w).value.split(/\n/).map(x=>x.trim()).filter(Boolean);LS.set('invs',S.invs);
      w.remove();toast('저장했습니다');
      S.lastErr='';
      if(S.lastQuery)doSearch(S.lastQuery);
    };
    $('#sMove',w).onclick=()=>{
      if(!S.key){toast('먼저 키를 넣고 저장하세요');return}
      const url=location.origin+location.pathname+'?k='+encodeURIComponent(S.key);
      $('#sMoveBox',w).classList.remove('hidden');

    };

}
function openMic(){
  sheet(
   '<h2>마이크</h2><p class="sd">휴대폰 마이크에 에코를 걸어 스피커로 내보냅니다. <b>반드시 이어폰을 끼세요.</b> 스피커로 들으면 삐- 하는 하울링이 납니다.</p>'
  +'<div class="toggle"><div><b>마이크 켜기</b><small>브라우저 마이크 권한이 필요합니다</small></div><div class="sw'+(S.micOn?' on':'')+'" id="mOn"></div></div>'
  +'<div class="field"><label>목소리 크기 <span id="lv" style="color:var(--mint)">'+S.voice+'</span></label><input class="slider" id="mV" type="range" min="0" max="150" value="'+S.voice+'"></div>'
  +'<div class="field"><label>에코 <span id="le" style="color:var(--mint)">'+S.echo+'</span></label><input class="slider" id="mE" type="range" min="0" max="100" value="'+S.echo+'"></div>'
  +'<div class="field"><label>울림 <span id="lr" style="color:var(--mint)">'+S.rev+'</span></label><input class="slider" id="mR" type="range" min="0" max="100" value="'+S.rev+'"></div>'
  ,w=>{

    const bind=(sel,lab,k)=>{$(sel,w).oninput=e=>{S[k]=+e.target.value;$(lab,w).textContent=S[k];Mic.apply()}};
    bind('#mV','#lv','voice');bind('#mE','#le','echo');bind('#mR','#lr','rev');

/* ── 마이크 (유튜브 소리와는 별개로 동작) ── */
const Mic={
  ctx:null,src:null,stream:null,gain:null,delay:null,fb:null,conv:null,cg:null,wet:null,
  async init(){
    if(this.ctx)return;
    const C=window.AudioContext||window.webkitAudioContext;
    this.ctx=new C();
    this.gain=this.ctx.createGain();
    this.delay=this.ctx.createDelay(1);this.fb=this.ctx.createGain();
    this.delay.connect(this.fb);this.fb.connect(this.delay);
    this.conv=this.ctx.createConvolver();
    const sr=this.ctx.sampleRate,len=Math.floor(sr*2),b=this.ctx.createBuffer(2,len,sr);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    this.conv.buffer=b;this.cg=this.ctx.createGain();this.wet=this.ctx.createGain();
    this.gain.connect(this.ctx.destination);
    this.gain.connect(this.delay);this.delay.connect(this.wet);
    this.gain.connect(this.conv);this.conv.connect(this.cg);this.cg.connect(this.wet);
    this.wet.connect(this.ctx.destination);
  },
  apply(){
    if(!this.ctx)return;
    this.gain.gain.value=S.micOn?S.voice/100:0;
    this.fb.gain.value=(S.echo/100)*.55;
    this.delay.delayTime.value=.12+(S.echo/100)*.16;
    this.cg.gain.value=(S.rev/100)*.9;
  },
  async toggle(on){
    await this.init();
    if(this.ctx.state==='suspended')await this.ctx.resume();
    if(on){
      try{
        this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
        this.src=this.ctx.createMediaStreamSource(this.stream);this.src.connect(this.gain);
        S.micOn=true;toast('마이크 켜짐 — 이어폰을 끼세요');
      }catch(e){S.micOn=false;toast('마이크 권한이 거부되었습니다')}
    }else{
      if(this.src){try{this.src.disconnect()}catch(e){}this.src=null}
      if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
      S.micOn=false;
    }
    this.apply();
    $('#btnMic').style.background=S.micOn?'linear-gradient(135deg,var(--mint),#12A594)':'';
    return S.micOn;
  }
};

/* ── 유튜브 플레이어 ────────────────────── */
let YTP=null, ytReady=false, tickTimer=0;
window.onYouTubeIframeAPIReady=function(){
  const isHttp=/^https?:$/.test(location.protocol);
  const vars={autoplay:0,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,fs:0,disablekb:1};
  if(isHttp)vars.origin=location.origin;
  YTP=new YT.Player('ytPlayer',{height:'100%',width:'100%',playerVars:vars,events:{
    onReady:()=>{ytReady=true;},
    onStateChange:onState,
    onError:onErr
  }});
};
function onState(e){
  const st=e.data;
  $('#cPlay').textContent=(st===YT.PlayerState.PLAYING)?'❚❚':'▶';
  if(st===YT.PlayerState.PLAYING){
    hideMsg();poke();wakeOn();
    try{ if(Math.abs(YTP.getPlaybackRate()-S.rate)>0.001) applyRate(); }catch(e){}
  }
  if(st===YT.PlayerState.ENDED){ if(S.autoNext) nextSong(); else showMsg('곡이 끝났습니다'); }
}
function onErr(e){
  const it=S.queue[S.nowIdx];
  const code=e.data;
  const why = (code===101||code===150)?'이 영상은 외부 재생이 막혀 있습니다'
            : (code===100)?'영상이 삭제되었거나 비공개입니다' : '재생할 수 없습니다 (오류 '+code+')';
  if(!it){showMsg(why);return}
  it.dead.push(it.cand[it.ci].id);
  const next=it.cand.findIndex((c,i)=>i>it.ci&&!it.dead.includes(c.id));
  const alt=next>=0?next:it.cand.findIndex(c=>!it.dead.includes(c.id));
  if(alt>=0&&alt!==it.ci){
    it.ci=alt;saveQueue();
    toast(why+' — '+(alt+1)+'번 후보로 넘어갑니다');
    loadCurrent();
  }else{
    const vid=it.cand[it.ci]?it.cand[it.ci].id:'';
    showMsg(why+'<br>이 검색에서는 재생 가능한 영상을 못 찾았습니다.'
      +'<br><br><a class="btn" style="display:inline-block;text-decoration:none;color:var(--text)" target="_blank" rel="noopener"'
      +' href="https://www.youtube.com/watch?v='+vid+'">유튜브 앱에서 열기</a>'
      +' <button class="btn" onclick="nextSong()">다음곡</button>');
  }
}
function showMsg(h){$('#stMsg').innerHTML=h;$('#stMsg').classList.remove('hidden')}
function hideMsg(){$('#stMsg').classList.add('hidden')}

/* ── 무대 ───────────────────────────────── */
let hideT=0;
function poke(){
  $('#stTop').classList.remove('away');$('#stBot').classList.remove('away');
  clearTimeout(hideT);
  hideT=setTimeout(()=>{
    if(YTP&&ytReady&&YTP.getPlayerState&&YTP.getPlayerState()===1){
      $('#stTop').classList.add('away');$('#stBot').classList.add('away');
    }
  },3600);
}
function openStage(){
  $('#stage').classList.remove('hidden');
  poke();wakeOn();
  if(!tickTimer)tickTimer=setInterval(tick,300);
}
function closeStage(){
  $('#stage').classList.add('hidden');
  try{YTP&&YTP.pauseVideo()}catch(e){}
  clearInterval(tickTimer);tickTimer=0;wakeOff();
}
function playIdx(i){
  if(!S.queue[i]){showMsg('예약된 곡이 없습니다');return}
  S.nowIdx=i;loadCurrent();
}
function loadCurrent(){
  const it=S.queue[S.nowIdx];if(!it||!YTP||!ytReady){setTimeout(loadCurrent,400);return}
  const c=it.cand[it.ci];
  hideMsg();
  $('#stTitle').textContent=c.title;
  $('#stSub').textContent=verById(it.ver).label+' · '+c.ch+' · 후보 '+(it.ci+1)+'/'+it.cand.length;
  try{YTP.loadVideoById(c.id)}catch(e){showMsg('재생을 시작하지 못했습니다')}
  applyRate();
  renderDial();renderVChips();renderUpNext();renderQBar();
}
function nextSong(){
  if(S.nowIdx>=0)S.queue.splice(S.nowIdx,1);
  saveQueue();
  if(!S.queue.length){S.nowIdx=-1;try{YTP.stopVideo()}catch(e){}
    $('#stTitle').textContent='예약된 곡이 다 끝났습니다';$('#stSub').textContent='';
    $('#dial').innerHTML='';renderUpNext();showMsg('예약 목록이 비었습니다<br>나가서 다음 곡을 예약하세요');return}
  playIdx(0);
}
function renderDial(){
  const it=S.queue[S.nowIdx];const box=$('#dial');box.innerHTML='';
  if(!it)return;
  const lab=document.createElement('span');lab.className='dl';lab.textContent='후보';box.appendChild(lab);
  it.cand.slice(0,8).forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='d'+(i===it.ci?' on':'')+(it.dead.includes(c.id)?' dead':'');
    b.textContent=i+1;b.title=c.title;
    b.onclick=()=>{if(i===it.ci)return;it.ci=i;saveQueue();loadCurrent()};
    box.appendChild(b);
  });
}
function renderVChips(){
  const it=S.queue[S.nowIdx];const box=$('#vchips');box.innerHTML='';
  if(!it)return;
  VERSIONS.forEach(v=>{
    const b=document.createElement('button');
    b.className='vc'+(v.id===it.ver?' on':'');
    b.textContent=v.label;
    b.onclick=async()=>{
      if(v.id===it.ver)return;
      b.textContent='…';
      const rows=await searchYT(buildQuery(it.term,v.id));
      b.textContent=v.label;
      if(!rows){toast('그 버전을 찾지 못했습니다');return}
      it.ver=v.id;it.cand=rows.map(r=>({id:r.id,title:r.title,ch:r.ch,dur:r.dur}));it.ci=0;it.dead=[];
      saveQueue();loadCurrent();toast(v.label+' 버전으로 바꿨습니다');
    };
    box.appendChild(b);
  });
}
function renderUpNext(){
  const n=S.queue[S.nowIdx+1];const el=$('#upNext');
  if(!n){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  el.innerHTML='<em>다음</em>'+esc(n.cand[n.ci].title);
}
function tick(){
  if(!YTP||!ytReady||!YTP.getDuration)return;
  const d=YTP.getDuration()||0,c=YTP.getCurrentTime()||0;
  $('#progFill').style.width=(d?c/d*100:0)+'%';
  $('#tCur').textContent=mmss(c);$('#tDur').textContent=mmss(d);
}
/* 속도: 유튜브는 음정을 유지한 채 빠르기만 바꾼다 */
function applyRate(retryDir){
  if(!YTP||!ytReady)return;
  try{
    YTP.setPlaybackRate(S.rate);
    setTimeout(()=>{
      let got=S.rate;
      try{got=YTP.getPlaybackRate()}catch(e){}
      if(Math.abs(got-S.rate)>0.001){
        S.fineRate=false; S.rate=got;
        if(retryDir){ stepRate(retryDir); return; }
      }
      $('#cRate').textContent=S.rate.toFixed(2);
    },240);
  }catch(e){}
  $('#cRate').textContent=S.rate.toFixed(2);
}
function stepRate(d){
  if(S.fineRate){
    S.rate=clamp(+(S.rate+d*0.05).toFixed(2),0.5,1.5);
  }else{
    let list=S.rates;
    try{const a=YTP.getAvailablePlaybackRates();if(a&&a.length)list=a}catch(e){}
    let i=list.findIndex(x=>Math.abs(x-S.rate)<0.001);
    if(i<0)i=list.indexOf(1);
    S.rate=list[clamp(i+d,0,list.length-1)];
  }
  applyRate(d);
}
function wakeOn(){
  if(!('wakeLock'in navigator)||S.wake)return;
  navigator.wakeLock.request('screen').then(w=>{S.wake=w;w.addEventListener('release',()=>{S.wake=null})}).catch(()=>{});
}
function wakeOff(){if(S.wake){try{S.wake.release()}catch(e){}S.wake=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#stage').classList.contains('hidden'))wakeOn()});

/* ── 조작 ───────────────────────────────── */
function renderChips(){
  const box=$('#chips');box.innerHTML='';
  VERSIONS.forEach(v=>{
    const b=document.createElement('button');
    b.className='chip'+(v.id===S.ver?' on':'');
    b.textContent=v.label;
    b.onclick=()=>{S.ver=v.id;LS.set('ver',v.id);renderChips();if(S.lastQuery)doSearch(S.lastQuery)};
    box.appendChild(b);
  });
}
function bind(){
  renderChips();renderQBar();
  $('#btnSearch').onclick=()=>doSearch($('#q').value);
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#q').blur();doSearch($('#q').value)}});
  $('#btnQuick').onclick=quickReserve;
  $('#btnQueue').onclick=openQueue;
  $('#btnSet').onclick=openSettings;
  $('#btnMic').onclick=openMic;
  $('#btnBook').onclick=openBook;
  $('#btnYT').onclick=()=>openYTSearch();
  $('#btnPaste').onclick=async()=>{
    let t='';
    try{ t=await navigator.clipboard.readText(); }
    catch(e){ toast('붙여넣기 권한이 없습니다 — 검색창을 길게 눌러 붙여넣으세요'); $('#q').focus(); return; }
    const n=await addByUrl(t);
    toast(n?n+'곡을 예약했습니다':'복사된 유튜브 링크가 없습니다');
  };
  $('#btnStart').onclick=()=>{
    if(!S.queue.length){toast('먼저 곡을 예약하세요');return}
    openStage();
    if(S.nowIdx<0||!S.queue[S.nowIdx])playIdx(0);
    else{try{YTP.playVideo()}catch(e){}}
  };
  $('#cPlay').onclick=()=>{
    if(!YTP||!ytReady)return;
    const st=YTP.getPlayerState();
    if(st===1)YTP.pauseVideo();else YTP.playVideo();
    poke();
  };
  $('#cBack').onclick=()=>{try{YTP.seekTo(Math.max(0,YTP.getCurrentTime()-10),true)}catch(e){};poke()};
  $('#cFwd').onclick=()=>{try{YTP.seekTo(YTP.getCurrentTime()+10,true)}catch(e){};poke()};
  $('#cNext').onclick=()=>{nextSong();poke()};
  $('#cExit').onclick=closeStage;
  $('#cFull').onclick=()=>{
    const el=$('#stage');
    if(!document.fullscreenElement){
      const rq=(el.requestFullscreen||el.webkitRequestFullscreen);
      if(rq)Promise.resolve(rq.call(el)).then(()=>{
        try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')}catch(e){}
      }).catch(()=>{});
    }else{
      try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
      document.exitFullscreen();
    }
    poke();
  };
  $$('[data-rate]').forEach(b=>b.onclick=()=>{stepRate(+b.dataset.rate);poke()});
  $('#prog').onclick=e=>{
    if(!YTP||!ytReady)return;
    const r=e.currentTarget.getBoundingClientRect();
    const d=YTP.getDuration()||0;
    if(d)YTP.seekTo(((e.clientX-r.left)/r.width)*d,true);
    poke();
  };
  $('#tapCatch').onclick=poke;
  addEventListener('keydown',e=>{
    if($('#stage').classList.contains('hidden'))return;
    if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('#cPlay').click()}
    else if(e.code==='ArrowRight')$('#cFwd').click();
    else if(e.code==='ArrowLeft')$('#cBack').click();
    else if(e.code==='Escape')closeStage();
    else if(/^Digit[1-8]$/.test(e.code)){const n=+e.code.slice(5)-1;const b=$$('#dial .d')[n];if(b)b.click()}
  });
}

window.nextSong=nextSong;

/* ── 시작 ───────────────────────────────── */
(function boot(){
  // 다른 기기에서 넘어온 키 받기
  try{
    const sp=new URLSearchParams(location.search);
    const k=sp.get('k');
    if(k){
      S.key=k.trim();LS.set('apikey',S.key);
      sp.delete('k');
      const rest=sp.toString();
      history.replaceState(null,'',location.pathname+(rest?'?'+rest:''));
      setTimeout(()=>toast('이 기기에 키를 저장했습니다'),700);
    }
  }catch(e){}
  bind();
  if(!/^https?:$/.test(location.protocol)){
    $('#warnBar').classList.remove('hidden');
    $('#warnBar').innerHTML='<b>파일을 직접 열면 유튜브가 재생되지 않습니다.</b><br>'
      +'시놀로지 Web Station이나 GitHub Pages 같은 웹 주소(http://·https://)에 올려두고 그 주소로 여세요.';
  }
  if(!S.key&&!LS.get('seen',false)){
    LS.set('seen',true);
    setTimeout(()=>toast('설정에서 유튜브 API 키를 넣으면 훨씬 안정적입니다'),1400);
  }
})();
</script>
